services:
  - type: web
    name: smart-attendance
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_attendance.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: smart-attendance-db
    databaseName: smart_attendance
    user: smart_attendance_user
